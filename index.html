<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #000;
    color: #FFFF00;
    font-size: 40px;
    font-weight: bold;
    margin: 0;
    padding: 20px;
}

/* ✅ 上段（やさしいボタン） */
#easyControls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

#easyControls button {
    flex: 1;
    font-size: 26px;
    padding: 18px;
    border-radius: 12px;
    border: none;
    font-weight: bold;
}

#easyStart { background: #00C853; color: white; }
#easyStop { background: #D50000; color: white; }

/* ✅ 下段（最下部ボタン） */
#bottomControl {
    margin-bottom: 15px;
}

#scrollBtn {
    width: 100%;
    font-size: 22px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2962FF;
    color: white;
    font-weight: bold;
}

#status {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 10px;
}

#result {
    white-space: pre-wrap;
}
</style>
</head>

<body>

<!-- ✅ メイン操作 -->
<div id="easyControls">
    <button id="easyStart">▶ 会話スタート</button>
    <button id="easyStop">■ 終了（休憩）</button>
</div>

<!-- ✅ 最下部へ -->
<div id="bottomControl">
    <button id="scrollBtn">▼ 最下部へ</button>
</div>

<div id="status">準備OK</div>
<div id="result">ここに表示されます</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let autoScrollEnabled = true;

// ✅ 手動スクロール → 自動OFF
window.addEventListener("scroll", () => {
    autoScrollEnabled = false;
});

function autoScroll() {
    if (autoScrollEnabled) {
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }
}

if (!SpeechRecognition) {
    document.getElementById('status').innerText = "非対応ブラウザ";
} else {

    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    let isListening = false;
    let finalText = "";

    const status = document.getElementById('status');
    const result = document.getElementById('result');

    const easyStart = document.getElementById('easyStart');
    const easyStop = document.getElementById('easyStop');
    const scrollBtn = document.getElementById('scrollBtn');

    function startListening() {
        if (!isListening) {
            finalText = "";
            recognition.start();
        }
    }

    function stopListening() {
        if (isListening) {
            isListening = false;
            recognition.stop();
        }
    }

    easyStart.onclick = startListening;
    easyStop.onclick = stopListening;

    // ✅ 最下部ボタン（ここが重要）
    scrollBtn.onclick = () => {
        autoScrollEnabled = true;
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    };

    recognition.onstart = () => {
        isListening = true;
        status.innerText = "● 聞き取り中";
    };

    function summarize(text) {
        return text
            .replace(/えー|あのー|えっと|そのー|なんか/g, "")
            .split(/[。\n]/)
            .filter(s => s.length > 5)
            .slice(-5)
            .map(s => "・" + s.trim())
            .join("\n");
    }

    recognition.onresult = (e) => {
        let interim = "";

        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
