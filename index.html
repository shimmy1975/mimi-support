<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミミサポ</title>

<style>
body {
    background: #000;
    color: #FFFF00;
    font-size: 42px;
    font-weight: bold;
    margin: 0;
    padding: 20px;
}
#status {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 15px;
}
#result {
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="status">タップで開始</div>
<div id="result">ここに表示されます</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let isUserScrolling = false;

// ✅ ユーザー操作検知
window.addEventListener("touchstart", () => {
    isUserScrolling = true;
});

window.addEventListener("touchend", () => {
    setTimeout(() => {
        isUserScrolling = false;
    }, 2000);
});

// ✅ 自動スクロール
function autoScroll() {
    if (!isUserScrolling) {
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }
}

if (!SpeechRecognition) {
    document.getElementById('status').innerText = "非対応ブラウザ";
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    let isListening = false;
    let finalText = "";

    const status = document.getElementById('status');
    const result = document.getElementById('result');

    document.body.onclick = () => {
        if (!isListening) {
            finalText = "";
            recognition.start();
        } else {
            isListening = false;
            recognition.stop();
        }
    };

    recognition.onstart = () => {
        isListening = true;
        status.innerText = "● 聞き取り中";
    };

    function summarize(text) {
        return text
            .replace(/えー|あのー|えっと|そのー|なんか/g, "")
            .split(/[。\n]/)
            .filter(s => s.length > 5)
            .slice(-5)
            .map(s => "・" + s.trim())
            .join("\n");
    }

    recognition.onresult = (e) => {
        let interim = "";

        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
                finalText += e.results[i][0].transcript + "\n";
            } else {
                interim += e.results[i][0].transcript;
            }
        }

        result.innerText =
            summarize(finalText) +
            "\n\n---聞き取り中---\n" +
            interim;

        // ✅ 自動スクロール発動
        autoScroll();
    };

    recognition.onend = () => {
        if (isListening) {
            recognition.start();
        } else {
            status.innerText = "タップで再開";
        }
    };
}
</script>

</body>
</html>
