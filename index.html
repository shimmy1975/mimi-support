<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #000;
    font-family: sans-serif;
    overflow: hidden; /* 全体スクロール禁止 */
}

/* ✅ 上部固定 */
#topControls {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #000;
    padding: 10px;
    display: flex;
    gap: 10px;
    z-index: 10;
}

#topControls button {
    flex: 1;
    font-size: 24px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
}

#easyStart { background: #00C853; color: white; }
#easyStop { background: #D50000; color: white; }

/* ✅ 下部固定 */
#bottomControls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000;
    padding: 10px;
    z-index: 10;
}

#scrollBtn {
    width: 100%;
    font-size: 22px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2962FF;
    color: white;
}

/* ✅ ステータス */
#status {
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    text-align: center;
    color: #888;
    font-size: 18px;
}

/* ✅ 本文エリア（ここだけスクロール） */
#content {
    position: absolute;
    top: 110px;
    bottom: 80px;
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
}

/* ✅ 黄色文字 */
#result {
    color: #FFFF00;
    font-size: 40px;
    font-weight: bold;
    white-space: pre-wrap;
}
</style>

</head>

<body>

<!-- ✅ 上部ボタン -->
<div id="topControls">
    <button id="easyStart">▶ 会話スタート</button>
    <button id="easyStop">■ 終了（休憩）</button>
</div>

<div id="status">準備OK</div>

<!-- ✅ スクロールエリア -->
<div id="content">
    <div id="result">ここに表示されます</div>
</div>

<!-- ✅ 下部ボタン -->
<div id="bottomControls">
    <button id="scrollBtn">▼ 最下部へ</button>
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let autoScrollEnabled = true;

const content = document.getElementById('content');

// ✅ 手動スクロールで自動OFF
content.addEventListener("scroll", () => {
    autoScrollEnabled = false;
});

// ✅ 自動スクロール
function autoScroll() {
    if (autoScrollEnabled) {
        content.scrollTop = content.scrollHeight;
    }
}

if (!SpeechRecognition) {
    document.getElementById('status').innerText = "非対応ブラウザ";
} else {

    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    let isListening = false;
    let finalText = "";

    const status = document.getElementById('status');
    const result = document.getElementById('result');

    const easyStart = document.getElementById('easyStart');
    const easyStop = document.getElementById('easyStop');
    const scrollBtn = document.getElementById('scrollBtn');

    function startListening() {
        if (!isListening) {
            finalText = "";
            recognition.start();
        }
    }

    function stopListening() {
        if (isListening) {
            isListening = false;
            recognition.stop();
        }
    }

    easyStart.onclick = startListening;
    easyStop.onclick = stopListening;

    // ✅ 最下部へ
    scrollBtn.onclick = () => {
        autoScrollEnabled = true;
        content.scrollTop = content.scrollHeight;
    };

    recognition.onstart = () => {
        isListening = true;
        status.innerText = "● 聞き取り中";
    };

    function summarize(text) {
        return text
            .replace(/えー|あのー|えっと|そのー|なんか/g, "")
            .split(/[。\n]/)
            .filter(s => s.length > 5)
            .slice(-5)
            .map(s => "・" + s.trim())
            .join("\n");
    }

    recognition.onresult = (e) => {
        let interim = "";

        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
                finalText += e.results[i][0].transcript + "\n";
            } else {
                interim += e.results[i][0].transcript;
            }
        }

        result.innerText =
            summarize(finalText) +
            "\n\n---聞き取り中---\n" +
            interim;

        autoScroll();
    };

    recognition.onend = () => {
        if (isListening) {
            recognition.start();
        } else {
            status.innerText = "休憩中（▶で再開）";
        }
    };
}
</script>

</body>
</html>
